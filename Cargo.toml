[workspace]
resolver = "2"
members  = ["apps/ingest"]

[workspace.package]
edition = "2021"
authors = ["Clarity Team"]
license = "MIT"

# Shared dependency versions — members inherit these via workspace = true
[workspace.dependencies]
axum          = { version = "0.8",  features = ["json"] }
sqlx          = { version = "0.9",  features = ["runtime-tokio", "postgres", "tls-rustls"] }
tokio         = { version = "1",    features = ["full"] }
uuid          = { version = "1",    features = ["v4"] }
serde         = { version = "1",    features = ["derive"] }
serde_json    = "1"
tower-http    = { version = "0.6",  features = ["cors", "trace"] }
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy       = "0.15"
