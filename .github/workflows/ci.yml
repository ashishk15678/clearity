name: CI (all)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fan-out to per-service workflows via workflow_call would require them to
  # be refactored — instead we just run a lightweight gate job that blocks
  # merge until both specialist workflows pass.
  gate:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: []          # standalone — the status check is added to branch rules
    steps:
      - run: echo "Branch protection gate — individual workflow jobs run in parallel."
